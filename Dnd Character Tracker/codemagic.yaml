workflows:
  android-html-app:
    name: Build HTML App to APK
    max_build_duration: 15
    scripts:
      - name: Install Node dependencies and Capacitor
      script: |
        npm install
        npm install @capacitor/core @capacitor/cli
        npx cap init "Dnd Character Tracker" "com.dnd.app" --web.dir=.
        npx cap add android
      - name: Build Android Package
        script: |
        cd android
        ./gradlew assembleRelease
    artifacts:
      - android/app/build/outputs/apk/release/*.apk
